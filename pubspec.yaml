name: ninjachiken
description: "Ninja Chiken Game"
publish_to: 'none' 
version: 1.0.0+1

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_svg: ^2.2.0
  audioplayers: ^6.5.0
  shared_preferences: ^2.5.3
  intl: ^0.20.2
  flutter_bloc: ^9.1.1
  url_launcher: ^6.3.2
  firebase_core: ^4.0.0
  firebase_messaging: ^16.0.0
  flutter_local_notifications: ^19.4.0
  firebase_app_installations: ^0.4.0
  package_info_plus: ^8.0.2
  webview_flutter: ^4.7.0
  http: ^1.2.0
  supabase_flutter: ^2.9.1
  flutter_dotenv: ^5.2.1
  
  

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: "^0.14.4"

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/png/iconapp.png"
  min_sdk_android: 21

flutter: 
  uses-material-design: true

  assets:
    - assets/png/
    - assets/svg/
    - assets/fonts/
    - assets/sounds/
    - .env

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Medium.ttf
